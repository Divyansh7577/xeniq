<!DOCTYPE html>
<html lang="en" data-theme="xeniq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050010" id="tc">
<title>XENIQ · Smart Calculator</title>
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#07060f;--pr:139,92,246;--cr:34,211,238;--kr:232,121,249;--p:rgb(var(--pr));--c:rgb(var(--cr));--pk:rgb(var(--kr));--tx:#f4f3ff;--mut:#8b88a8;--g1:rgba(255,255,255,.08);--g2:rgba(255,255,255,.02);--line:rgba(255,255,255,.1);--inp:rgba(0,0,0,.35);--ab:.36;--red:#fb7185;--ease:cubic-bezier(.2,.8,.2,1);--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace}
[data-theme=xeniq]{--bg:#050010;--pr:139,60,240;--cr:196,148,255;--kr:236,92,250}
[data-theme=ember]{--bg:#0e0705;--pr:249,115,22;--cr:251,191,36;--kr:251,113,133}
[data-theme=matrix]{--bg:#020a05;--pr:16,185,129;--cr:163,230,53;--kr:45,212,191}
[data-theme=amoled]{--bg:#000;--ab:0}
[data-theme=paper]{--bg:#f3f1ff;--pr:124,58,237;--cr:8,145,178;--kr:192,38,211;--tx:#1b1a2e;--mut:#6b6a85;--g1:rgba(255,255,255,.95);--g2:rgba(255,255,255,.7);--line:rgba(30,20,80,.14);--inp:rgba(255,255,255,.95);--ab:.16;--red:#e11d48}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
.aurora{position:fixed;inset:0;pointer-events:none;background:radial-gradient(60vmax 60vmax at 0% 0%,rgba(var(--pr),calc(var(--ab)*.9)),transparent 70%),radial-gradient(55vmax 55vmax at 100% 100%,rgba(var(--cr),calc(var(--ab)*.55)),transparent 70%),radial-gradient(35vmax 35vmax at 60% 45%,rgba(var(--kr),calc(var(--ab)*.3)),transparent 70%)}
.aurora i{display:none}
.app{position:relative;height:100%;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:calc(max(env(safe-area-inset-top),var(--safe-area-inset-top,0px)) + 8px) 14px calc(max(env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px)) + 8px)}
header{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo{width:36px;height:30px;object-fit:contain}
.brand span{background:linear-gradient(90deg,#c4b5fd,#e879f9);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.18em;font-weight:800}
.chips{display:flex;gap:6px;font-size:12px;color:var(--mut)}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:none;cursor:pointer}
.chip.on{color:var(--c);border-color:rgba(var(--cr),.5)}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex;animation:in .15s}
@keyframes in{from{opacity:0}}
.glass{background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--line);border-radius:24px}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
/* calculator */
#v-calc{display:flex}
#v-calc:not(.on){display:none}
.screen{position:relative;padding:12px 18px 14px;margin-bottom:10px;text-align:right;min-height:136px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.screen::before{content:"";position:absolute;inset:0;background:url(mark.png) no-repeat 10px 44px/118px;opacity:.13;pointer-events:none}
.screen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--p),var(--c),transparent)}
.mbadge{position:absolute;top:14px;right:18px;font:600 12px var(--mono);color:var(--pk);opacity:0}
.mbadge.on{opacity:1}
.sci-toggle{position:absolute;top:12px;left:14px;border:1px solid var(--line);background:rgba(var(--pr),.08);border-radius:99px;padding:5px 12px;font-size:12px;cursor:pointer;transition:.25s}
.sci-toggle.on{background:var(--p);border-color:var(--p);color:#fff}
#last{font:400 13px var(--mono);color:var(--mut);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 40px 0 90px}
#main{text-shadow:0 0 26px rgba(var(--pr),.55);font:500 54px/1.15 var(--mono);white-space:nowrap;overflow-x:auto;scrollbar-width:none;letter-spacing:-1px}
#main::-webkit-scrollbar{display:none}
#prev{font:500 17px var(--mono);color:var(--c);min-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sci{display:none;grid-template-columns:repeat(6,1fr);gap:6px}
.sci.open{display:grid;margin-bottom:8px}
.sci .key{min-height:38px;font-size:14px;border-radius:13px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:9px;flex:1;min-height:0}
.key{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,var(--g1),var(--g2));font:500 24px var(--mono);cursor:pointer;display:grid;place-items:center;touch-action:manipulation;transition:transform .1s;box-shadow:inset 0 1px 0 rgba(255,255,255,.09)}
.key:active{transform:scale(.9);background:rgba(var(--pr),.3)}
.key.op{color:var(--c);background:linear-gradient(180deg,rgba(var(--cr),.2),rgba(var(--cr),.05));border-color:rgba(var(--cr),.28);font-size:28px}
.key.fn{color:var(--pk);background:linear-gradient(180deg,rgba(var(--kr),.18),rgba(var(--kr),.04));border-color:rgba(var(--kr),.24)}
.key.ac{color:var(--red)}
.key.eq{background:linear-gradient(135deg,var(--p),var(--pk));border:0;color:#fff;font-size:32px;box-shadow:0 8px 26px rgba(var(--pr),.5)}
@media (orientation:landscape) and (min-width:640px){
 #v-calc.on{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:12px}
 #v-calc .screen{margin:0;min-height:110px}#main{font-size:42px}
 #v-calc .sci{display:grid;grid-column:1;grid-row:2;margin:0;align-content:start}
 #v-calc .sci .key{min-height:46px}
 #v-calc .pad{grid-column:2;grid-row:1/3}.sci-toggle{display:none}#last{padding-left:20px}.key{font-size:20px}
}
@media (max-height:480px){.dock button span{display:none}.dock button{padding:6px 0}header{display:none}}
@media (max-height:700px) and (orientation:portrait){.screen{min-height:104px}#main{font-size:42px}.key{font-size:20px;border-radius:18px}}
/* start screen */
#boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;color:#fff;transition:opacity .5s,visibility .5s}
#boot.out{opacity:0;visibility:hidden}
#boot img{object-fit:contain;border-radius:14%}
#boot h1{font:700 30px var(--sans);letter-spacing:-.5px}
#boot p{font:400 15px/1.45 var(--sans);max-width:300px}
#boot .bar{width:140px;height:4px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:16px}
#boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--c));animation:bbar var(--d,2s) linear forwards}
@keyframes bbar{to{width:100%}}
.a-zoom>*{animation:bz .8s var(--ease) both}@keyframes bz{from{opacity:0;transform:scale(.6)}}
.a-fade>*{animation:bf 1s both}@keyframes bf{from{opacity:0}}
.a-slide>*{animation:bs .8s var(--ease) both}@keyframes bs{from{opacity:0;transform:translateY(30px)}}
.a-glow img{animation:bg 1.6s ease-in-out infinite alternate}@keyframes bg{from{filter:drop-shadow(0 0 6px var(--p))}to{filter:drop-shadow(0 0 28px var(--c))}}
#boot>*:nth-child(2){animation-delay:.12s}#boot>*:nth-child(3){animation-delay:.24s}
/* dock */
.dock{display:flex;gap:4px;padding:5px;margin-top:10px}
.dock button{flex:1;background:none;border:0;border-radius:18px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:11px;cursor:pointer;transition:.25s}
.dock button.on{color:var(--tx);background:linear-gradient(135deg,rgba(var(--pr),.4),rgba(var(--cr),.22))}
.dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* tools */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding-bottom:6px}
.tcard{padding:14px;text-align:left;cursor:pointer;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.tcard:active{transform:scale(.96)}
.tcard .ic{min-width:40px;padding:0 8px;align-self:flex-start;height:40px;border-radius:13px;display:grid;place-items:center;font:600 14px var(--mono);color:#fff;background:linear-gradient(135deg,var(--p),var(--c))}
.tcard b{font-size:15px}.tcard small{color:var(--mut);font-size:12px;line-height:1.35}
.thead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.thead button{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:rgba(var(--pr),.1);cursor:pointer;font-size:18px}
.thead b{font-size:18px}
.tool{padding:16px;margin-bottom:10px}
.fld{margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
.inp{width:100%;background:var(--inp);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:500 16px var(--mono);outline:none;transition:.2s;appearance:none;-webkit-appearance:none;min-height:46px}
.inp:focus{border-color:var(--c);box-shadow:0 0 0 3px rgba(var(--cr),.18)}
.inp.bad{border-color:var(--red)}
select.inp{font-family:var(--sans)}
textarea.inp{resize:none;line-height:1.5;white-space:pre;overflow-x:auto}
.out{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{background:var(--inp);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;min-width:0}
.cell b{display:block;font:500 12px var(--sans);color:var(--mut);margin-bottom:3px}
.cell span{font:500 15px var(--mono);word-break:break-word;white-space:pre-wrap}
.cell.wide{grid-column:1/-1}.cell.hi span{color:var(--c);font-size:19px}
.note{color:var(--mut);font-size:12px;margin-top:10px;line-height:1.5}
.btn{width:100%;border:0;border-radius:14px;padding:13px;font-weight:600;background:linear-gradient(135deg,var(--p),var(--c));color:#fff;cursor:pointer}
.crow{display:flex;gap:10px;align-items:center;padding:11px 14px;margin-bottom:8px;cursor:pointer;border-radius:16px}
.crow:active{background:rgba(var(--pr),.25)}
.crow .s{font:600 16px var(--mono);color:var(--pk);width:46px}.crow .n{flex:1;font-size:14px}.crow small{display:block;color:var(--mut);font:400 12px var(--mono)}
.crow button{border:1px solid var(--line);background:none;border-radius:10px;padding:6px 9px;cursor:pointer}
.nbrow{display:flex;justify-content:space-between;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:14px}
.nbrow span:first-child{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nbrow span:last-child{color:var(--c);font-weight:600}
/* graph */
.gwrap{flex:1;min-height:180px;position:relative;overflow:hidden;border-radius:24px;touch-action:none}
#gc{position:absolute;inset:0;width:100%;height:100%}
#gInfo{font:500 13px var(--mono);color:var(--c);min-height:20px;padding:0 6px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.frow{display:flex;gap:8px;align-items:center;margin-top:8px}
.frow i{width:12px;height:12px;border-radius:50%;flex:none}
.frow .inp{padding:8px 12px;min-height:40px}
.gbar{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.gbar button{flex:none;border:1px solid var(--line);background:rgba(var(--pr),.1);border-radius:10px;padding:7px 11px;font:500 14px var(--mono);cursor:pointer}
.gbar button.on{background:var(--p);color:#fff}
@media (orientation:landscape) and (min-width:640px){#v-graph.on{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}#v-graph .gwrap{grid-row:1/4}}
.tcat{font:600 13px var(--sans);color:var(--mut);margin:14px 4px 8px}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}.row2 .fld{margin-bottom:10px}
.tgrid2{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.tgrid2 button{border:1px solid var(--line);background:rgba(var(--pr),.12);border-radius:10px;padding:9px 0;font:600 14px var(--mono);cursor:pointer}
.tbc{padding:12px 16px;margin-bottom:10px;scroll-margin-top:6px;cursor:pointer}.tbc b{color:var(--c)}
.tbl{font:500 15px/1.75 var(--mono);white-space:pre;columns:2;margin-top:6px}
/* history & settings */
.h{padding:12px 16px;display:flex;flex-direction:column;align-items:flex-end;cursor:pointer;margin-bottom:8px}
.h small{font:400 13px var(--mono);color:var(--mut)}.h strong{font:500 22px var(--mono);color:var(--c)}
.empty{text-align:center;color:var(--mut);padding:50px 20px;line-height:1.6}
.ghost{margin-top:8px;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.3);color:var(--red);border-radius:14px;padding:12px;font-weight:600;cursor:pointer;width:100%}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}.setrow small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.sw{display:flex;gap:10px}.sw button{width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw button.on{border-color:var(--tx)}
.tg{width:50px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--inp);position:relative;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.25s var(--ease)}
.tg.on{background:var(--p)}.tg.on::after{left:23px;background:#fff}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translate(-50%,20px);background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.3s var(--ease);max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.lite *,.lite *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ============ START SCREEN: edit anything here ============ */
const SPLASH={
 enabled:true,
 once:false,                      // true = show only the first time the app opens
 duration:1600,                   // milliseconds
 background:'radial-gradient(circle at 50% 35%,#3a0a78,#050010 72%)',   // any CSS colour, gradient or url(...)
 image:'icon.png',                // file from your repo, a web URL, or a data: URI. '' = no image
 imageSize:220,
 title:'',                      // the logo already shows the name. Type text here to add a title under it
 tagline:['{greet}, ready to solve?','{date}','Smart maths for smart students','Built by Nexus Tech'],   // text, or a list: one is picked at random each launch
 titleColor:'#ffffff',
 taglineColor:'#a9a6c9',
 anim:'zoom',                     // zoom | fade | slide | glow | none
 loader:true,                     // progress bar
 skipOnTap:true,
 html:'',                         // your own markup. If filled, it replaces image, title and tagline
 css:''                           // extra CSS for the start screen, e.g. '#boot h1{font-size:44px}'
};
/* {greet} = Good morning/afternoon/evening   {date} = today's date. Both work in title, tagline and html. */
</script>
<script>
(function(){const C=SPLASH;if(!C.enabled)return;
 if(C.once){try{if(localStorage.getItem('nx-seen'))return;localStorage.setItem('nx-seen','1')}catch(e){}}
 const hr=new Date().getHours(),sub=s=>String(s).replace(/\{greet\}/g,hr<12?'Good morning':hr<17?'Good afternoon':'Good evening').replace(/\{date\}/g,new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'}));
 const b=document.createElement('div');b.id='boot';b.className='a-'+C.anim;b.style.background=C.background;b.style.setProperty('--d',C.duration+'ms');
 if(C.html)b.innerHTML=sub(C.html);
 else{
  if(C.image){const i=new Image();i.src=C.image;i.width=i.height=C.imageSize;i.alt='';i.onerror=()=>i.remove();b.append(i)}
  if(C.title){const t=document.createElement('h1');t.textContent=sub(C.title);t.style.color=C.titleColor;b.append(t)}
  const tl=Array.isArray(C.tagline)?C.tagline[Math.floor(Math.random()*C.tagline.length)]:C.tagline;
  if(tl){const p=document.createElement('p');p.textContent=sub(tl);p.style.color=C.taglineColor;b.append(p)}
 }
 if(C.loader){const bar=document.createElement('div');bar.className='bar';bar.append(document.createElement('i'));b.append(bar)}
 if(C.css){const st=document.createElement('style');st.textContent=C.css;document.head.append(st)}
 document.body.append(b);
 let done=0;const hide=()=>{if(done)return;done=1;b.classList.add('out');setTimeout(()=>b.remove(),700)};
 if(C.skipOnTap)b.onclick=hide;setTimeout(hide,C.duration);
})();
</script>

<script>
/* ====== STATE ====== */
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=Object.assign({theme:'xeniq',haptic:true,hs:2,deg:false,prec:0,lite:false},load('nx-set',{}));

   case'cone':{const l=Math.hypot(a,b);return[['Volume',q(P*a*a*b/3),0,1],['Slant height',q(l)],['Curved surface',q(P*a*l)],['Total surface',q(P*a*(a+l)),0,1]]}
   case'cube':return[['Volume',q(a**3),0,1],['Surface area',q(6*a*a),0,1],['Space diagonal',q(a*Math.sqrt(3))]];
   default:return[['Volume',q(a*b*c),0,1],['Surface area',q(2*(a*b+b*c+a*c)),0,1],['Space diagonal',q(Math.hypot(a,b,c))]]}}},

const G={cx:0,cy:0,s:48,fns:[null,null,null],raw:['sin(x)','x^2/4-2',''],tr:false,tx:null},GC=['#22d3ee','#e879f9','#fbbf24'];
let gctx,gW=0,gH=0,dpr=1,gfocus=null,gStep=1,gq=0;
const gDrawQ=()=>{if(!gq)gq=requestAnimationFrame(()=>{gq=0;gDraw()})};
function gResize(){const c=$('#gc'),w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;dpr=Math.min(devicePixelRatio||1,2);gColors();c.width=w*dpr;c.height=h*dpr;gW=w;gH=h;gctx=c.getContext('2d');gDraw()}
const gf=n=>String(+n.toPrecision(6));
function gDraw(){if(!gctx||!gW)return;const x=gctx,line=gcol.line,tx=gcol.tx,mut=gcol.mut;
 x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,gW,gH);
 const sx=a=>(a-G.cx)*G.s+gW/2,sy=a=>gH/2-(a-G.cy)*G.s,raw=70/G.s,mg=Math.pow(10,Math.floor(Math.log10(raw))),r=raw/mg,step=(r>=5?5:r>=2?2:1)*mg;
 const x0=G.cx-gW/2/G.s,x1=G.cx+gW/2/G.s,y0=G.cy-gH/2/G.s,y1=G.cy+gH/2/G.s;
 x.lineWidth=1;x.font='11px system-ui,sans-serif';x.fillStyle=mut;x.strokeStyle=line;
 const ay=Math.min(gH-6,Math.max(14,sy(0)+13)),axx=Math.min(gW-30,Math.max(4,sx(0)+4));
 for(let i=Math.ceil(x0/step);i*step<=x1;i++){const p=sx(i*step);x.beginPath();x.moveTo(p,0);x.lineTo(p,gH);x.stroke();if(i)x.fillText(gf(i*step),p+3,ay)}
 for(let j=Math.ceil(y0/step);j*step<=y1;j++){const p=sy(j*step);x.beginPath();x.moveTo(0,p);x.lineTo(gW,p);x.stroke();if(j)x.fillText(gf(j*step),axx,p-3)}
 x.strokeStyle=tx;x.globalAlpha=.55;x.lineWidth=1.5;x.beginPath();x.moveTo(sx(0),0);x.lineTo(sx(0),gH);x.moveTo(0,sy(0));x.lineTo(gW,sy(0));x.stroke();x.globalAlpha=1;
 G.fns.forEach((f,i)=>{if(!f)return;x.strokeStyle=GC[i];x.lineWidth=2.3;x.lineJoin='round';x.beginPath();let pen=false,py=0;
  for(let px=0;px<=gW;px+=gStep){let y;try{y=f(G.cx+(px-gW/2)/G.s)}catch(e){y=NaN}if(typeof y!=='number'||!isFinite(y)||Math.abs(y)>1e7){pen=false;continue}const p=sy(y);if(!pen||Math.abs(p-py)>gH*3){x.moveTo(px,p);pen=true}else x.lineTo(px,p);py=p}x.stroke()});
 if(G.tx!=null){const p=sx(G.tx);x.strokeStyle=tx;x.globalAlpha=.4;x.setLineDash([5,5]);x.beginPath();x.moveTo(p,0);x.lineTo(p,gH);x.stroke();x.setLineDash([]);x.globalAlpha=1;
  let info='x = '+q(G.tx);G.fns.forEach((f,i)=>{if(!f)return;let y;try{y=f(G.tx)}catch(e){y=NaN}info+='   f'+(i+1)+' = '+q(y);if(isFinite(y)){x.fillStyle=GC[i];x.beginPath();x.arc(p,sy(y),5,0,7);x.fill()}});$('#gInfo').textContent=info}}
const gc=$('#gc'),pts=new Map();let pd=0;
const pdist=()=>{const a=[...pts.values()];return a.length<2?0:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
const gT=px=>{G.tx=G.cx+(px-gW/2)/G.s;gDrawQ()};
gc.addEventListener('pointerdown',e=>{gStep=2;gc.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.offsetX,e.offsetY]);pd=pdist();if(G.tr&&pts.size===1)gT(e.offsetX)});
gc.addEventListener('pointermove',e=>{const o=pts.get(e.pointerId);if(!o)return;const n=[e.offsetX,e.offsetY];
 if(pts.size===1){if(G.tr)G.tx=G.cx+(n[0]-gW/2)/G.s;else{G.cx-=(n[0]-o[0])/G.s;G.cy+=(n[1]-o[1])/G.s}}
 pts.set(e.pointerId,n);if(pts.size===2){const d=pdist();if(pd)G.s=Math.min(1e5,Math.max(.01,G.s*d/pd));pd=d}gDrawQ()});
['pointerup','pointercancel'].forEach(t=>gc.addEventListener(t,e=>{pts.delete(e.pointerId);pd=0;if(!pts.size){gStep=1;gDraw()}}));

 G.fns.forEach((f,i)=>{if(!f)return;const found=[];let prev=null;for(let k=0;k<=1500&&found.length<6;k++){const xx=x0+(x1-x0)*k/1500;let y;try{y=f(xx)}catch(e){prev=null;continue}if(!isFinite(y)){prev=null;continue}
